name: Publish static assets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hkts3-assets-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test && npm run check
      - name: Publish validated public archive to mainland project
        run: node scripts/publish.mjs --apply
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
      - name: Preserve archive and deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdn-release-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 30
